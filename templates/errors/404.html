{% extends "base.html" %}
{% block title %}404 Not Found | Smart Job Portal{% endblock %}
{% block content %}
<div class="container section">
  <div class="empty-state" style="max-width: 600px; margin: 3rem auto;">
    <div class="empty-state-icon" style="color: var(--teal-600);"><i class="fa-solid fa-compass"></i></div>
    <h1 class="empty-state-title">404 - Page Not Found</h1>
    <p class="empty-state-desc">The job vacancy or page you are looking for has moved, expired, or does not exist.</p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="{% url 'job_list' %}" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Explore Jobs</a>
      <a href="{% url 'home' %}" class="btn btn-outline"><i class="fa-solid fa-house"></i> Home</a>
    </div>
  </div>
</div>
{% endblock %}
