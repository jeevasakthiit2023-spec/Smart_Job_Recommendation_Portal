{% extends "base.html" %}
{% block title %}500 Server Error | Smart Job Portal{% endblock %}
{% block content %}
<div class="container section">
  <div class="empty-state" style="max-width: 600px; margin: 3rem auto;">
    <div class="empty-state-icon" style="color: var(--rose);"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1 class="empty-state-title">500 - Internal Server Error</h1>
    <p class="empty-state-desc">An unexpected issue occurred while processing your request. Our automated diagnostics have logged this event.</p>
    <a href="{% url 'home' %}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Home</a>
  </div>
</div>
{% endblock %}
